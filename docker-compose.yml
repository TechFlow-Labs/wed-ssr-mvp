services:
  web:
    build: .
    expose:
      - "3000"
    # Για δοκιμή χωρίς nginx: ξεσχολιάστε την επόμενη γραμμή
    # ports:
    #   - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:8060}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8060}
    networks:
      - local_sandbox_2

  nginx:
    build: ./nginx
    environment:
      WEDDING_API_NGINX_UPSTREAM: ${WEDDING_API_NGINX_UPSTREAM:-wedding-plan-nginx-prod:8050}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - local_sandbox_2

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew || true; sleep 12h & wait $${!}; done;'"
    networks:
      - local_sandbox_2
    depends_on:
      - nginx

volumes:
  certbot-www:
  certbot-conf:

# Same bridge as wed-main-app / wed-backend (docker network create … local_sandbox_2)
networks:
  local_sandbox_2:
    external: true
    name: local_sandbox_2
