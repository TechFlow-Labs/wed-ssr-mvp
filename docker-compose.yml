# Coolify deployment for wed-ssr-mvp (Next.js SSR)
# Set the following in Coolify environment variables:
#   API_INTERNAL_URL    - backend URL for server-side fetches (SSR rewrites)
#                         Production: https://api.yourdomain.com
#                         Preview:    https://<preview-backend-fqdn>
#   NEXT_PUBLIC_API_URL - backend URL embedded in client-side JS bundle
#                         Same value as API_INTERNAL_URL in most cases
#
# Coolify generates SERVICE_FQDN_WEB_3000 from the FQDN you set in the UI.

services:
  web:
    build: .
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://localhost:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wed-ssr.rule=Host(`${SERVICE_FQDN_WEB_3000}`)"
      - traefik.http.routers.wed-ssr.entrypoints=https
      - traefik.http.routers.wed-ssr.tls=true
      - traefik.http.routers.wed-ssr.tls.certresolver=letsencrypt
      - traefik.http.services.wed-ssr.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
    name: coolify
