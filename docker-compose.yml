services:
  web:
    build: .
    expose:
      - "3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:8060}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8060}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wed-ssr.rule=Host(`wedapp.gr`)"
      - "traefik.http.routers.wed-ssr.entrypoints=https"
      - "traefik.http.routers.wed-ssr.tls=true"
      - "traefik.http.routers.wed-ssr.tls.certresolver=letsencrypt"
      - "traefik.http.services.wed-ssr.loadbalancer.server.port=3005"

networks:
  coolify:
    external: true
    name: coolify
