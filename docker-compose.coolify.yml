services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wedadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-weddingplan}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db/schema.sql:/docker-entrypoint-initdb.d/01-pg-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wedadmin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [preview-internal]

  backend:
    build:
      context: https://x-access-token:${GITHUB_TOKEN}@github.com/TechFlow-Labs/wed-backend.git#${BACKEND_BRANCH:-main}:src/app
      dockerfile: Dockerfile.api_prod
    environment:
      DB_USER: ${DB_USER:-wedadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-weddingplan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER}
    depends_on:
      db:
        condition: service_healthy
    networks: [preview-internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:8000
      # NEXT_PUBLIC_API_URL intentionally absent: api.ts browser path falls back
      # to window.location.origin/public-api, which nginx proxies to backend:8000
    depends_on: [backend]
    networks: [preview-internal]

  main:
    build:
      context: https://x-access-token:${GITHUB_TOKEN}@github.com/TechFlow-Labs/wed-main-mvp.git#${MAIN_BRANCH:-main}
      args:
        EXPO_PUBLIC_API_URL: /api
    environment:
      WEDDING_API_NGINX_UPSTREAM: backend:8000
    depends_on: [backend]
    networks: [preview-internal]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    environment:
      PREVIEW_MODE: "true"
      WEDDING_API_NGINX_UPSTREAM: backend:8000
    depends_on: [web, main]
    ports:
      - "80"
    networks:
      - preview-internal
      - traefik-public

volumes:
  db-data:

networks:
  preview-internal:
    driver: bridge
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}
