# Production: HTTPS + ACME webroot + HTTP → HTTPS redirect

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name wedapp.gr main.wedapp.gr;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wedapp.gr;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wedapp.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedapp.gr/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Browser API (same origin). With proxy_pass $var alone nginx can forward the *original* URI; append $uri after rewrite.
    # Upstream host:port substituted at container start (40-wedapp-config.sh).
    location /public-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # set must come before rewrite ... break (break skips later rewrite-module directives, including set).
        set $wedding_api http://__WEDDING_API_NGINX_UPSTREAM__;
        rewrite ^/public-api/(.*)$ /$1 break;
        proxy_pass $wedding_api$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name main.wedapp.gr;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wedapp.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedapp.gr/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Main app (Expo web) calls same-origin /api/* instead of localhost:8060 (see wed-main-app dist patch).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wedding_api http://__WEDDING_API_NGINX_UPSTREAM__;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $wedding_api$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resolver + variable: resolve at request time on shared Docker network; nginx starts even if wedmainapp is down briefly.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wedmain_upstream http://wedmainapp:80;
        proxy_pass $wedmain_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
