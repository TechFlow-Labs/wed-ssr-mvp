server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — required to resolve dynamic upstreams at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Browser API calls: proxy /public-api/ to the same-branch backend preview.
    # __WEDDING_API_NGINX_UPSTREAM__ is substituted by the entrypoint script
    # with the value of the WEDDING_API_NGINX_UPSTREAM environment variable.
    location /public-api/ {
        set $backend __WEDDING_API_NGINX_UPSTREAM__;
        proxy_pass          $backend/;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify      off;
    }

    # Everything else goes to the Next.js server.
    location / {
        proxy_pass          http://web:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection 'upgrade';
        proxy_set_header    Host       $host;
        proxy_cache_bypass  $http_upgrade;
    }
}
